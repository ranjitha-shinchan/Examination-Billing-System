{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>View Records</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>

<div class="container">
    <h1>Choose Records to View</h1>

    <form method="post">
        {% csrf_token %}
        <button type="submit" name="exam_type" value="theory">
            View Theory Records
        </button><br>

        <button type="submit" name="exam_type" value="practical">
            View Practical Records
        </button>
    </form>

    <a href="{% url 'exam_choice' %}" class="back-btn">
        ⬅ Back to Home
    </a>
</div>

</body>
</html>
